
name: Python unittest CI

on:
  push:
    branches: [Q2, Q2-agent]
  pull_request:
    branches: [Q2, Q2-agent]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Run unittest
        run: python -m unittest CalcTest -v
